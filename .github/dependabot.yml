version: 2
updates:
  # Always enabled: CI workflows and the npm wrapper manifest.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  # Go overlay: keep module dependencies current for Go CLI tools.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
