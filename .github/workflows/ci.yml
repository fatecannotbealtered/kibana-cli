name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.23', '1.24']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - run: go mod tidy

      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"

      - name: Lint
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2

      - run: go vet ./...

      - name: check-clean (no legacy ES-direct artifacts)
        if: runner.os == 'Linux'
        run: bash scripts/check-clean.sh

      - run: go build -v ./...

      - run: go test -race -v ./...

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          go build -ldflags "-s -w -X github.com/fatecannotbealtered/kibana-cli/cmd.version=1.0.0" -o kibana-cli-test ./cmd/kibana-cli
          ./kibana-cli-test --version
          ./kibana-cli-test reference | head -5

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          go build -ldflags "-s -w -X github.com/fatecannotbealtered/kibana-cli/cmd.version=1.0.0" -o kibana-cli-test.exe ./cmd/kibana-cli
          .\kibana-cli-test.exe --version
