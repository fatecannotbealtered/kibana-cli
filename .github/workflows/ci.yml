name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Go version is sourced from go.mod — the single source of truth.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      # SEC-050 requires an audit per shipped ecosystem, fail-closed. This is
      # the Go half (it covers the vendored internal/aicli too); the `npm audit`
      # job below is the wrapper half. govulncheck also covers the Go standard
      # library, so a toolchain CVE turns CI red -- fix it by moving the `go`
      # directive in go.mod, which setup-go reads above.
      - name: Go vulnerability audit
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Project-specific clean check
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          if [ -f scripts/check-clean.sh ]; then
            if ! command -v rg >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y ripgrep
            fi
            bash scripts/check-clean.sh
          else
            echo "No scripts/check-clean.sh; skipping project-specific clean check."
          fi

      - name: golangci-lint
        # Action v8+ pairs with golangci-lint v2 (the .golangci.yml `version: "2"`
        # config format). The vendored internal/aicli is excluded there.
        uses: golangci/golangci-lint-action@v9
        with:
          # 'latest' tracks the newest v2 linter release; pin to a specific
          # version (e.g. v2.1.0) once you want reproducible lint results.
          version: latest

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # go test ./... includes the aicli conformance suite (VER-001: the write
      # gate for every write command, the contract on real output, reference
      # budgets) and the registry coverage check (VER-003). Every OS runs it:
      # the gate's state store behaves differently on Windows.
      - name: Run tests with coverage
        # bash on all platforms: pwsh splits the unquoted -coverprofile=coverage.out
        # at the dot, passing a stray ".out" package arg to go test
        shell: bash
        run: go test -coverprofile=coverage.out ./...

      - name: Ensure race detector toolchain
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          if ! command -v gcc >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y build-essential
          fi

      - name: Run race tests
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: Upload coverage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out

  npm-audit:
    name: npm audit, version and spec sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install package metadata
        run: npm install --ignore-scripts --omit=optional --no-audit --no-fund

      - name: Audit npm dependencies
        run: npm audit --audit-level=high --omit=optional

      # Fail-closed: every derived version location must equal package.json.
      - name: Verify version sync
        run: node scripts/check-version.js

      # Fail-closed (REPO-SPEC, SEC-050): internal/aicli must match its
      # MANIFEST.json (offline, strict), and every vendored spec file, schema and
      # library file must match the spec tag in .agent/SPEC_VERSION (remote; a
      # failed download degrades to a warning). Node only: there is no codegen.
      - name: Verify spec, contract and library sync
        run: node scripts/check-spec.js

  # REPO-041 / CLI-090 (SHOULD): the npm launcher may add at most 100 ms per
  # call. This builds the binary into a local platform package, then compares
  # the median of 11 runs of `--version` through scripts/run.js with the binary
  # run directly (the npm .cmd shim on Windows adds a little more). Informational:
  # a miss does not block the merge; it means the README's Agent Install must put
  # the native binary on PATH for agents.
  launcher-budget:
    name: Launcher budget (${{ matrix.os }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Measure launcher overhead
        shell: bash
        run: |
          set -euo pipefail
          plat=$(node -p "process.platform + '-' + process.arch")
          pkg=$(node -p "require('./package.json').name")
          name=$(node -p "Object.keys(require('./package.json').bin)[0]")
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          dir="node_modules/$pkg-$plat"
          mkdir -p "$dir/bin"
          go build -o "$dir/bin/$name$ext" ./cmd/kibana-cli
          printf '{"name": "%s-%s", "version": "0.0.0"}\n' "$pkg" "$plat" > "$dir/package.json"
          node -e '
            const { spawnSync } = require("child_process");
            const median = (cmd, args) => {
              const t = [];
              for (let i = 0; i < 11; i++) {
                const s = process.hrtime.bigint();
                spawnSync(cmd, args, { stdio: "ignore" });
                t.push(Number(process.hrtime.bigint() - s) / 1e6);
              }
              return t.sort((a, b) => a - b)[5];
            };
            const direct = median(process.argv[1], ["--version"]);
            const launched = median(process.execPath, ["scripts/run.js", "--version"]);
            const extra = Math.round(launched - direct);
            console.log(`binary ${direct.toFixed(0)} ms, through the launcher ${launched.toFixed(0)} ms: +${extra} ms`);
            if (extra > 100) {
              console.log(`::warning::the npm launcher adds ${extra} ms (budget 100 ms); document the native binary path for agents (REPO-041)`);
              process.exit(1);
            }
          ' "$dir/bin/$name$ext"

  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: [lint, test, npm-audit]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build and smoke test
        # explicit -o never appends .exe, so name the output per-OS;
        # bash keeps one step working across all three runners
        shell: bash
        run: |
          BIN=kibana-cli
          [ "$RUNNER_OS" = "Windows" ] && BIN=kibana-cli.exe
          go build -o "$BIN" ./cmd/kibana-cli
          "./$BIN" --help
          "./$BIN" reference --index > /dev/null
