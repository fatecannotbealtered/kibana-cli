name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.23']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: go mod tidy
      - name: npm package audit
        run: |
          npm audit --audit-level=high --omit=dev
          npm pack --dry-run
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: check-clean
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep
          bash scripts/check-clean.sh
      - run: go build -v ./...
      - run: go test -race -v ./...
      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          go build -o kibana-cli-test ./cmd/kibana-cli
          ./kibana-cli-test --version
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          go build -o kibana-cli-test.exe ./cmd/kibana-cli
          .\kibana-cli-test.exe --version

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          NOTES="/tmp/release-notes.md"
          sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | sed '$ { /^## \[/d }' > "$NOTES"
          [ -s "$NOTES" ] || cp CHANGELOG.md "$NOTES"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes=/tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: npm pack --dry-run
      - name: Verify version consistency
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version (${TAG_VERSION}) != package.json (${PKG_VERSION})"
            exit 1
          fi
      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN not configured; skipping npm publish"
            exit 0
          fi
          VERSION="${GITHUB_REF#refs/tags/v}"
          if npm view "@fatecannotbealtered-/kibana-cli@${VERSION}" version 2>/dev/null | grep -qx "${VERSION}"; then
            echo "npm ${VERSION} already published; skipping"
            exit 0
          fi
          npm publish --access public
