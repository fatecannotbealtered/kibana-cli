name: Release

on:
  push:
    tags:
      - "v*"

# SEC-050: every job gets read access only; the release job, which signs and
# publishes, and the npm job, which publishes with provenance, ask for more.
permissions:
  contents: read

# VER-008: the release path runs the same gates as the merge path (ci.yml) --
# formatting, vet, lint, tests with the conformance suite, the dependency audits,
# the version guard and the spec/library drift guard -- before anything is built
# or signed. A release blocked by a fresh upstream advisory or a drifted vendored
# library is the intended outcome, not a regression.

jobs:
  ci:
    name: CI
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Go version is sourced from go.mod — the single source of truth.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      # SEC-050: the release path gates on the same dependency audit the
      # merge path does. Without this, a CVE published after the last green run
      # on main ships: this job re-runs formatting, vet and tests at tag time but
      # never asked whether the code it is about to sign has a known reachable
      # vulnerability.
      - name: Go vulnerability audit
        if: runner.os == 'Linux'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: golangci-lint
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      # Refuse to publish a binary whose vendored specs, contract or
      # internal/aicli library have drifted from the pinned spec tag.
      - uses: actions/setup-node@v7
        if: runner.os == 'Linux'
        with:
          node-version: '20'

      - name: Verify spec, contract and library sync
        if: runner.os == 'Linux'
        run: node scripts/check-spec.js

      - name: Project-specific clean check
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          if [ -f scripts/check-clean.sh ]; then
            if ! command -v rg >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y ripgrep
            fi
            bash scripts/check-clean.sh
          else
            echo "No scripts/check-clean.sh; skipping project-specific clean check."
          fi

      # Includes the aicli conformance suite (VER-001) and the coverage check (VER-003).
      - name: Test
        run: go test ./...

      - name: Ensure race detector toolchain
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          if ! command -v gcc >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y build-essential
          fi

      - name: Race test
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  # SEC-050: the npm wrapper ships too, so the release path runs the npm half
  # of the audit and the version guard -- the same steps as ci.yml's npm-audit
  # job -- before the release job signs anything. It is a separate job so
  # node_modules never lands in the tree the ci job tests.
  npm-audit:
    name: npm audit and version sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install package metadata
        run: npm install --ignore-scripts --omit=optional --no-audit --no-fund

      - name: Audit npm dependencies
        run: npm audit --audit-level=high --omit=optional

      # Checked here, before signing, so a mismatched tag never produces a
      # GitHub release that the npm publish step would then refuse.
      - name: Verify tag and version sync
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match package.json version (${PKG_VERSION})"
            exit 1
          fi
          node scripts/check-version.js

  release:
    name: Release
    needs: [ci, npm-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Extract release notes
        run: |
          # Slice the '## [VERSION]' section out of CHANGELOG.md for this tag.
          VERSION="${GITHUB_REF#refs/tags/v}"
          sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | sed '$ { /^## \[/d }' > release-notes.md
          # Defensive fallback: if the slice is empty, ship the whole changelog.
          [ -s release-notes.md ] || cp CHANGELOG.md release-notes.md

      # Sigstore keyless signing: .goreleaser.yml signs checksums.txt with
      # `cosign sign-blob --new-bundle-format` using this job's OIDC identity.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes=release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          always-auth: true

      - name: Verify version consistency
        run: |
          # Guard: the git tag must match package.json version, else the npm
          # release would diverge from the GitHub release.
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match package.json version (${PKG_VERSION})"
            exit 1
          fi
          # Extend the guard to every derived location (SKILL.md, lockfile pins,
          # optionalDependencies, CHANGELOG), not just package.json.
          node scripts/check-version.js

      - name: Download release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist verify
          gh release download "${GITHUB_REF_NAME}" --dir dist --pattern "*.tar.gz" --pattern "*.zip"
          gh release download "${GITHUB_REF_NAME}" --dir verify --pattern "checksums.txt" --pattern "checksums.txt.sigstore.json"
          find dist -type f \( -name "*.tar.gz" -o -name "*.zip" \) -print

      # SEC-050: the archives repackaged for npm are the ones this tag's release job
      # signed: checksums.txt is verified against its Sigstore bundle, bound to the
      # exact identity of this workflow at this tag, and every archive against
      # checksums.txt, before anything is repackaged.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify the signed checksums
        shell: bash
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle verify/checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            verify/checksums.txt
          cd dist
          for f in *.tar.gz *.zip; do
            [ -e "$f" ] || continue
            grep -q "  ${f}\$" ../verify/checksums.txt || { echo "::error::${f} is not listed in checksums.txt"; exit 1; }
          done
          sha256sum --check --ignore-missing ../verify/checksums.txt

      - name: Prepare npm platform packages
        run: node scripts/prepare-npm-platform-packages.js dist npm-platform

      - name: Publish to npm
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          ROOT_PKG=$(node -p "require('./package.json').name")
          # A prerelease (a semver tag with a "-" part) goes to the next dist-tag, so
          # `npm install -g` never picks it up implicitly (CLI-070).
          DIST_TAG=latest
          case "$VERSION" in *-*) DIST_TAG=next ;; esac

          for dir in npm-platform/*; do
            [ -d "$dir" ] || continue
            PKG=$(node -p "require('./${dir}/package.json').name")
            if npm view "${PKG}@${VERSION}" version 2>/dev/null | grep -qx "${VERSION}"; then
              echo "npm package ${PKG}@${VERSION} already published; skipping"
              continue
            fi
            npm publish "./$dir" --access public --provenance --tag "$DIST_TAG"
          done

          if npm view "${ROOT_PKG}@${VERSION}" version 2>/dev/null | grep -qx "${VERSION}"; then
            echo "npm package ${ROOT_PKG}@${VERSION} already published; skipping"
            exit 0
          fi
          # Keep platform pins in lockstep with the package version (single
          # source of truth): rewrite optionalDependencies to the published
          # version so an npm install never resolves a stale platform binary.
          node -e "const fs=require('fs'),p=require('./package.json');for(const k in (p.optionalDependencies||{}))p.optionalDependencies[k]=p.version;fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+String.fromCharCode(10))"
          npm publish --access public --provenance --tag "$DIST_TAG"
