version: 2

project_name: kibana-cli

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/kibana-cli
    binary: kibana-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/fatecannotbealtered/kibana-cli/cmd.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Windows ARM64 is not built natively; prepare-npm-platform-packages.js
    # reuses the amd64 binary, which runs via Windows x64 emulation on ARM.
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    wrap_in_directory: false
    # Every channel carries the Skills of its own version (REPO-043, SKL-009):
    # the archive ships skills/ beside the binary, and the binary update path
    # syncs the Skills from there.
    files:
      - skills/**/*

checksum:
  name_template: checksums.txt

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--new-bundle-format"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

release:
  # Idempotent re-tagging: overwrite artifacts if the release already exists.
  replace_existing_artifacts: true
  # A semver prerelease tag (v2.1.0-rc.1) is published as a GitHub prerelease, so
  # it is never the latest release; `update` installs one only with
  # --target-version (CLI-070).
  prerelease: auto
